# Raw Cilium TracingPolicy — volume mount monitoring.
#
# RuntimePolicy v2 cannot express syscall hooks, so this hypothesis uses the
# raw cilium.io/v1alpha1 fallback: a kprobe on sys_mount that audits every
# mount(2) call with its source, target, filesystem type, mount flags and
# the return value (0 = success, negative = errno such as -EPERM).
#
# Applied verbatim by `ebpf-operator tracingpolicy add` (no v2 translation).
#
# int mount(const char *source, const char *target,
#           const char *filesystemtype, unsigned long mountflags,
#           const void *data);
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: citi-h20-volume-mount-monitoring
spec:
  kprobes:
  - call: "sys_mount"
    syscall: true
    return: true
    message: "mount() called in a container"
    args:
    - index: 0
      type: "string"   # source — e.g. /dev/sda1, tmpfs, host path for bind mounts
    - index: 1
      type: "string"   # target — where the volume is mounted
    - index: 2
      type: "string"   # filesystemtype — e.g. tmpfs, overlay, ext4, xfs
    - index: 3
      type: "uint64"   # mountflags — MS_RDONLY|MS_BIND|MS_REMOUNT|MS_NOSUID|...
    returnArg:
      index: 0
      type: "int"      # 0 on success, negative errno on failure (e.g. -13 EPERM)
    selectors:
    - matchActions:
      - action: Post