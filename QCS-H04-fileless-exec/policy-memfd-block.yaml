apiVersion: qualys.com/v2
kind: RuntimePolicy
metadata:
  name: citi-h04-memfd-block
spec:
  rules:
  # Can a process block rule stop a memfd exec? Probe which path form the
  # bprm binary resolves to for a memfd-backed file.
  - name: memfd-block-exec
    type: process
    id: memfd-block-exec
    action: block
    matchBinaries:
    - operator: Prefix
      values:
      - "/proc/self/fd/"
      - "/memfd:"
      - "memfd:"
    - operator: Postfix
      values:
      - "(deleted)"
