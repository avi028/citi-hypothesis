apiVersion: qualys.com/v2
kind: RuntimePolicy
metadata:
  name: citi-h05-east-west
spec:
  rules:
  # Records outbound TCP connections to the service port — the east-west
  # path between namespaces. Source process, src/dst IP, port, protocol
  # and connect result are all on the event.
  - name: east-west-egress
    type: network
    id: east-west-egress
    direction: egress
    action: audit
    # 8080 = the service port (successful + baseline); 9090 = the denied
    # port the hypothesis tests — attempts to it are recorded identically.
    matchPorts:
    - operator: In
      values:
      - "8080"
      - "9090"
