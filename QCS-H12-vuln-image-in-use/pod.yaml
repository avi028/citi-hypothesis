# QCS-H12 — Vulnerable Image "In Use" Prioritization
# CRS version support: 1.46+ — v2 process rule needed (no v1 process-exec)
#
# Two workloads from images that BOTH carry the target package (here
# openssl): the "used" pod invokes it, the "unused" pod never runs it.
# Image scan results (vuln + CVSS) come from the registry scan, not from
# these manifests.
apiVersion: v1
kind: Namespace
metadata:
  name: citi-h12
---
apiVersion: v1
kind: Pod
metadata:
  name: citi-h12-used
  namespace: citi-h12
spec:
  restartPolicy: Never
  containers:
  - name: used
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command:
    - sh
    - -c
    - |
      bash -c "echo in-use-marker"  # invoke the vulnerable package
      sleep 3600
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
---
apiVersion: v1
kind: Pod
metadata:
  name: citi-h12-unused
  namespace: citi-h12
spec:
  restartPolicy: Never
  containers:
  - name: unused
    image: registry.access.redhat.com/ubi9/ubi-minimal:latest
    command:
    - sh
    - -c
    - |
      echo "package present, never invoked"
      sleep 3600
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault